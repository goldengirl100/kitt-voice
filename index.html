
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KITT Voice</title>
<style>
body {
  margin: 0;
  background: #050505;
  color: #eee;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 45px 18px;
}
h1 {
  color: #e33;
  letter-spacing: 5px;
}
#scanner {
  height: 45px;
  max-width: 350px;
  margin: 40px auto;
  background: #200;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 0 25px #600;
}
#light {
  position: absolute;
  width: 25%;
  height: 100%;
  background: linear-gradient(
    90deg, transparent, red, #ff7777, red, transparent
  );
  animation: scan 2s ease-in-out infinite alternate;
}
@keyframes scan {
  from { left: 0; }
  to { left: 75%; }
}
button {
  border: 1px solid #e33;
  background: #191919;
  color: white;
  padding: 18px 25px;
  border-radius: 30px;
  font-size: 19px;
  margin: 8px;
}
#status {
  min-height: 60px;
  line-height: 1.5;
}
small { color: #aaa; }
</style>
</head>

<body>
<h1>KITT VOICE</h1>

<div id="scanner">
  <div id="light"></div>
</div>

<p id="status">Bereit, Geza.</p>

<button onclick="greet()">KITT starten</button>
<button onclick="listen()">🎙 Mikrofon</button>

<p><small>
KITT Testversion – Sprachsteuerung
</small></p>

<script>
const statusText = document.getElementById("status");

let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
}

if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function say(text) {
  statusText.textContent = text;

  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "de-DE";
  speech.rate = 0.82;
  speech.pitch = 0.65;
  speech.volume = 1;

  const germanVoices = voices.filter(v =>
    v.lang.toLowerCase().startsWith("de")
  );

  const preferred = germanVoices.find(v =>
    /markus|stefan|daniel|male/i.test(v.name)
  );

  if (preferred) {
    speech.voice = preferred;
  } else if (germanVoices.length) {
    speech.voice = germanVoices[0];
  }

  speechSynthesis.speak(speech);
}

function greet() {
  const hour = new Date().getHours();

  let greeting = "Guten Abend";

  if (hour < 11) greeting = "Guten Morgen";
  else if (hour < 18) greeting = "Guten Tag";

  say(
    greeting +
    ", Geza. Alle Systeme sind betriebsbereit. " +
    "Wie kann ich Ihnen helfen?"
  );
}

function reply(input) {
  const t = input.toLowerCase();

  let answer;

  if (t.includes("hallo")) {
    answer = "Guten Tag, Geza. Ich höre Ihnen zu.";
  }
  else if (t.includes("wie geht")) {
    answer =
      "Ausgezeichnet, Geza. Meine Systeme funktionieren einwandfrei.";
  }
  else if (t.includes("uhr") || t.includes("zeit")) {
    answer =
      "Geza, es ist " +
      new Date().toLocaleTimeString("de-AT", {
        hour: "2-digit",
        minute: "2-digit"
      }) + ".";
  }
  else if (t.includes("wetter")) {
    answer =
      "Geza, für aktuelle Wetterdaten benötige ich " +
      "eine Verbindung zu einem Wetterdienst.";
  }
  else if (t.includes("wer bist du")) {
    answer =
      "Ich bin KITT. Ihr persönlicher elektronischer Assistent.";
  }
  else if (t.includes("danke")) {
    answer =
      "Sehr gerne, Geza. Es ist mir ein Vergnügen.";
  }
  else {
    answer =
      "Interessante Frage, Geza. Meine aktuelle Testversion " +
      "verfügt noch nicht über eine vollständige künstliche Intelligenz.";
  }

  say(answer);
}

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    say(
      "Geza, die Spracherkennung wird von diesem Browser " +
      "leider nicht unterstützt."
    );
    return;
  }

  const recognition = new Recognition();

  recognition.lang = "de-DE";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    statusText.textContent = "Ich höre Ihnen zu, Geza ...";
  };

  recognition.onresult = event => {
    const spoken =
      event.results[0][0].transcript;

    reply(spoken);
  };

  recognition.onerror = event => {
    statusText.textContent =
      "Mikrofonfehler: " + event.error;
  };

  recognition.start();
}
</script>
</body>
</html>
