<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KITT Voice</title><style>body{margin:0;background:#050505;color:#eee;font-family:-apple-system,Arial;text-align:center;padding:50px 18px}h1{letter-spacing:5px;color:#e33}#scanner{height:45px;max-width:350px;margin:45px auto;background:#200;position:relative;overflow:hidden;border-radius:8px;box-shadow:0 0 25px #600}#light{position:absolute;width:25%;height:100%;background:linear-gradient(90deg,transparent,#f00,#ff7777,#f00,transparent);animation:scan 2s ease-in-out infinite alternate}@keyframes scan{from{left:0}to{left:75%}}button{border:1px solid #e33;background:#191919;color:white;padding:18px 25px;border-radius:30px;font-size:19px;margin:8px}#status{min-height:60px;line-height:1.5}small{color:#aaa}</style><h1>KITT VOICE</h1><div id="scanner"><div id="light"></div></div><p id="status">Guten Morgen, Michael. Alle Systeme sind betriebsbereit.</p><button onclick="greet()">KITT starten</button><button onclick="listen()">🎙 Mikrofon</button><p><small>Testversion: einfache Antworten ohne Online-KI. Spracherkennung hängt vom Browser ab.</small></p><script>const status=document.getElementById('status');function say(t){status.textContent=t;if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.85;u.pitch=.75;let v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('de'));if(v)u.voice=v;speechSynthesis.speak(u)}function greet(){say('Guten Morgen, Michael. Alle Systeme sind betriebsbereit. Wie kann ich Ihnen helfen?')}function reply(t){t=t.toLowerCase();let a=t.includes('wetter')?'Michael, für aktuelle Wetterdaten benötige ich eine Online-Verbindung.':t.includes('uhr')?'Michael, es ist '+new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'})+'.':t.includes('wie geht')?'Ausgezeichnet, Michael. Meine Systeme funktionieren einwandfrei.':t.includes('hallo')?'Guten Tag, Michael. Ich höre Ihnen zu.':'Interessante Frage, Michael. Meine erste Testversion verfügt noch nicht über eine vollständige künstliche Intelligenz.';say(a)}function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){say('Michael, die Spracherkennung wird in diesem Browser leider nicht unterstützt.');return}let r=new R();r.lang='de-DE';r.interimResults=false;r.onstart=()=>status.textContent='Ich höre zu, Michael ...';r.onresult=e=>reply(e.results[0][0].transcript);r.onerror=e=>status.textContent='Mikrofonfehler: '+e.error+'. Bitte Browserberechtigung prüfen.';r.start()}</script></html>
